    </div>
    <script>
        function getRandomNumber(current) {
            let next;
            do {
                next = Math.floor(Math.random() * 3) + 2;
            } while (next === current);
            return next;
        }

        const img = document.getElementById('random');
        let currentNumber = null;

        function setRandomImage() {
            currentNumber = getRandomNumber(currentNumber);
            const paddedNumber = String(currentNumber).padStart(2, '0');
            img.src = `hi/young-lions-artist-editions-highlights-${paddedNumber}.jpg`;
        }

        if (img) {
            setRandomImage();
            img.addEventListener('click', setRandomImage);
        }
    </script>
