    <script>
        function getRandomNumber(current) {
            let next;
            do {
                // Generates a random integer from 2 to 4 inclusive
                next = Math.floor(Math.random() * 3) + 2;
            } while (next === current);
            return next;
        }

        const img = document.getElementById('random');
        let currentNumber = null;

        function setRandomImage() {
            currentNumber = getRandomNumber(currentNumber);
            const paddedNumber = String(currentNumber).padStart(2, '0');
            img.src = `hi/young-lions-artist-editions-highlights-${paddedNumber}.jpg`;
        }

        if (img) {
            setRandomImage();
            img.addEventListener('click', setRandomImage);
        }
    </script>
    <script>
        function shuffleGrid() {
            const grid = document.querySelector('.grid');
            const articles = Array.from(grid.children);

            // Fisher-Yates Shuffle Algorithm
            for (let i = articles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [articles[i], articles[j]] = [articles[j], articles[i]];
            }

            // Re-append items in the new shuffled order
            articles.forEach(article => grid.appendChild(article));
        }

        // Run on page load or attach to a button click
        shuffleGrid();
    </script>
    <script>
        const books = document.querySelectorAll('article');

        books.forEach(book => {
            book.addEventListener('click', (e) => {
                if (e.target.closest('a')) {
                    return;
                }
                if (book.dataset.url) {
                    window.location.href = book.dataset.url;
                }
            });
        });
    </script>
