<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Untitled Silkscreen Books by Blaise Larmee</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css.css">
    <meta property="og:title" content="Untitled Silkscreen Books by Blaise Larmee">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://blaiselarmee.com/untitled-silkscreen-books.html">
    <meta property="og:image" content="https://blaiselarmee.com/lo/untitled-silkscreen-book-01.jpg">
    <meta name="twitter:card" content="summary_large_image">
</head>

<body>
    <a href="index.html">Blaise Larmee</a>

    <article data-url="untitled-silkscreen-book-01.html">
        <img src="lo/untitled-silkscreen-book-01.jpg">
    </article>

    <article data-url="untitled-silkscreen-book-02.html">
        <img src="lo/untitled-silkscreen-book-02.jpg">
    </article>

    <article data-url="untitled-silkscreen-book-03.html">
        <img src="lo/untitled-silkscreen-book-03.jpg">
    </article>
    <script>
        const books = document.querySelectorAll('article');

        books.forEach(book => {
            book.addEventListener('click', (e) => {
                if (e.target.closest('a')) {
                    return;
                }
                if (book.dataset.url) {
                    window.location.href = book.dataset.url;
                }
            });
        });
    </script>
</body>

</html>
