    <blockquote>I glued a picture to the cover and got rid of the insides.</blockquote>
    <script>
        const randomNumber = Math.floor(Math.random() * 51) + 1;
        const paddedNumber = String(randomNumber).padStart(2, '0');
        const img = document.getElementById('random');

        if (img && (randomNumber < 47 || randomNumber > 49)) {
            img.src = `hi/3-books-artist-editions-highlights-${paddedNumber}.jpg`;
        }

        function setRandomImage() {
            let randomNumber;

            // Pick a random number 1-51, skipping 47-49
            do {
                randomNumber = Math.floor(Math.random() * 51) + 1;
            } while (randomNumber >= 47 && randomNumber <= 49);

            const paddedNumber = String(randomNumber).padStart(2, '0');
            img.src = `hi/3-books-artist-editions-highlights-${paddedNumber}.jpg`;
        }

        if (img) {
            // Set cursor to pointer and add rounded corners
            img.style.cursor = 'pointer';

            // Set initial random image on load
            setRandomImage();

            // Change image whenever it's clicked
            img.addEventListener('click', setRandomImage);
        }        </script>

    <script>
        function shuffleGrid() {
            const grid = document.querySelector('.grid');
            const articles = Array.from(grid.children);

            // Fisher-Yates Shuffle Algorithm
            for (let i = articles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [articles[i], articles[j]] = [articles[j], articles[i]];
            }

            // Re-append items in the new shuffled order
            articles.forEach(article => grid.appendChild(article));
        }
         shuffleGrid()

    </script>
    <script>
        const books = document.querySelectorAll('article');

        books.forEach(book => {
            book.addEventListener('click', (e) => {
                if (e.target.closest('a')) {
                    return;
                }
                if (book.dataset.url) {
                    window.location.href = book.dataset.url;
                }
