    <script>
        const imageData = {
            set_young_lions: ["lo/young-lions-artist-edition-01.jpg","lo/young-lions-artist-edition-02.jpg","lo/young-lions-artist-edition-03.jpg","lo/young-lions-artist-edition-04.jpg","lo/young-lions-artist-edition-05.jpg","lo/young-lions-artist-edition-06.jpg","lo/young-lions-artist-edition-07.jpg","lo/young-lions-artist-edition-08.jpg","lo/young-lions-artist-edition-09.jpg","lo/young-lions-artist-edition-10.jpg"],

            set_silkscreen: ["lo/untitled-silkscreen-book-01.jpg","lo/untitled-silkscreen-book-02.jpg","lo/untitled-silkscreen-book-03.jpg"]
        };

        const imgTargets = [document.getElementById('random-0'), document.getElementById('random-1'), document.getElementById('random-2')];

        if (imgTargets[0] && imageData.set_young_lions.length > 0) {
            const idx = Math.floor(Math.random() * imageData.set_young_lions.length);
            imgTargets[0].src = imageData.set_young_lions[idx];
        }
        if (imgTargets[1] && imageData.set_3_books.length > 0) {
            const idx = Math.floor(Math.random() * imageData.set_3_books.length);
            imgTargets[1].src = imageData.set_3_books[idx];
        }
        if (imgTargets[2] && imageData.set_silkscreen.length > 0) {
            const idx = Math.floor(Math.random() * imageData.set_silkscreen.length);
            imgTargets[2].src = imageData.set_silkscreen[idx];
        }

        // Shuffle the gallery articles in place
        (function() {
            const grid = document.querySelector('div.grid');
            if (grid) {
                const articles = Array.from(grid.querySelectorAll('article'));
                for (let i = articles.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [articles[i], articles[j]] = [articles[j], articles[i]];
                }
                articles.forEach(article => grid.appendChild(article));
            }
        })();
    </script>
    <script>
        const books = document.querySelectorAll('article');

        books.forEach(book => {
            book.addEventListener('click', (e) => {
                if (e.target.closest('a')) {
                    return;
                }
                if (book.dataset.url) {
                    window.location.href = book.dataset.url;
                }
            });
        });
    </script>
