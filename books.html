    <script>

// Helper to generate dynamic image arrays with exclusions
function generateImages(template, maxCount, exclude = [], folderPrefix = 'lo/') {
    const list = [];
    for (let i = 1; i <= maxCount; i++) {
        if (exclude.includes(i)) continue;
        const paddedNum = String(i).padStart(2, '0');
        list.push(`${folderPrefix}${template}${paddedNum}.jpg`);
    }
    return list;
}

// 2. Specific item pairs
const itemPairs = [
    [
        {
            url: "3-books-artist-editions.html",
            title: "3 Books",
            images: generateImages("3-books-artist-edition-", 28, [5, 7, 13, 20, 24, 28])
        },
        {
            url: "young-lions-artist-editions.html",
            title: "Young Lions",
            images: [`lo/young-lions-artist-edition-07.jpg`]
        }
    ],
    [
        {
            url: "2001.html",
            title: "2001",
            images: [`lo/2001.jpg`]
        },
        {
            url: "mirror-mirror.html",
            title: "Mirror Mirror",
            images: [`lo/mirror-mirror.jpg`]
        }
    ],
    [
        {
            url: "altcomics-7.html",
            title: "Altcomics 7",
            images: [`lo/altcomics-7.jpg`]
        },
        {
            url: "jaywalk.html",
            title: "Jaywalk",
            images: [`lo/jaywalk.jpg`]
        }
    ],
    [
        {
            url: "untitled-silkscreen-books.html",
            title: "Untitled",
            images: generateImages("untitled-silkscreen-book-", 3)
        },
        {
            url: "the-whale.html",
            title: "The Whale",
            images: [`lo/the-whale.jpg`]
        }
    ]
];

// 3. Flatten pairs into ordered list
const itemsList = itemPairs.flat();

// 4. Construct markup for all items
let articlesHTML = '';

itemsList.forEach(item => {
    const selectedImg = item.images[Math.floor(Math.random() * item.images.length)];
    
    articlesHTML += `
        <article data-url="${item.url}">
            <img src="${selectedImg}">
            <p>${item.title}</p>
        </article>
    `;
});

// 5. Inject into main.grid inside body
const gridContainer = document.querySelector('body > main.grid');
if (gridContainer) {
    gridContainer.innerHTML = articlesHTML;
}
    </script>
    <script>
        const books = document.querySelectorAll('article');

        books.forEach(book => {
            book.addEventListener('click', (e) => {
                if (e.target.closest('a')) {
                    return;
                }
                if (book.dataset.url) {
                    window.location.href = book.dataset.url;
                }
            });
        });
    </script>
</body>
