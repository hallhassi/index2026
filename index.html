<html>

<head>
    <title>Blaise Larmee</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css.css">
</head>

<body>
    <header>
        <h1>Blaise Larmee</h1>
        <a href="books.html">books</a>
        <a href="shows.html">shows</a>
    </header>
    <main>
            <article style="width:fit-content">
        <img id="random">
    </article>
    <a class="buy" href="bio.html">BIO</a>
    </main>


<script>
// Determine folder prefix based on screen width
const isMobile = window.innerWidth <= 768; // Adjust threshold as needed
const prefix = isMobile ? 'lo/' : 'hi/';

function generateImages(template, maxCount, folderPrefix = prefix) {
    const list = [];
    for (let i = 1; i <= maxCount; i++) {
        const paddedNum = String(i).padStart(2, '0');
        list.push(`${folderPrefix}${template}${paddedNum}.jpg`);
    }
    return list;
}

const imageData = [
    {
        "src": "2001.html",
        "hrefs": generateImages("2001-", 91)
    },
    {
        "src": "3-books-artist-editions.html",
        "hrefs": generateImages("3-books-artist-edition-", 28)
    },
    {
        "src": "young-lions-artist-editions.html",
        "hrefs": generateImages("young-lions-artist-edition-", 10)
    },
    {
        "src": "apartment-gallery.html",
        "hrefs": generateImages("apartment-", 10)
    },
    {
        "src": "my-parents.html",
        "hrefs": generateImages("myparents-", 7)
    }
];

// --- DOM Manipulation Logic ---
const randomIndex = Math.floor(Math.random() * imageData.length);
const randomItem = imageData[randomIndex];

const imgElement = document.getElementById('random');
const linkElement = imgElement ? imgElement.closest('article') : null;

if (imgElement && randomItem) {
    const randomHrefsIndex = Math.floor(Math.random() * randomItem.hrefs.length);
    const randomImageSrc = randomItem.hrefs[randomHrefsIndex];

    imgElement.src = randomImageSrc;

    if (linkElement) {
        linkElement.dataset.url = randomItem.src;
    }
}
</script>
    <script>
        const books = document.querySelectorAll('article');

        books.forEach(book => {
            book.addEventListener('click', (e) => {
                if (e.target.closest('a')) {
                    return;
                }
                if (book.dataset.url) {
                    window.location.href = book.dataset.url;
                }
            });
        });
    </script>
</body>

</html>
