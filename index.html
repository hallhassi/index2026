<script>
const list = document.getElementById('list');
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');
const vid = document.getElementById('vid');

const baseDPR = window.devicePixelRatio || 1;
const items = [];
let activeItem = null;
let isZoomed = false;
let pinchStartDist = 0;

function isGifv(url) {
  return /\.gifv(\?.*)?$/i.test(url);
}

function parseSources(img) {
  const srcset = img.getAttribute('srcset');
  if (srcset) {
    const candidates = [...srcset.matchAll(/(\S+)\s+(\d+)w/g)]
      .map(([, url, wStr]) => {
        const w = parseInt(wStr, 10);
        const m = url.match(/\/s(\d+)x(\d+)/);
        const maxDim = m ? Math.max(+m[1], +m[2]) : w;
        return { url, w, maxDim };
      })
      .sort((a, b) => a.w - b.w);

    if (candidates.length) {
      const under400 = candidates.filter(c => c.maxDim <= 400);
      const lo = under400.length ? under400[under400.length - 1] : candidates[0];
      const hi = candidates[candidates.length - 1];
      return { loSrc: lo.url, hiSrc: hi.url };
    }
  }

  const src = img.getAttribute('src') || '';
  let hiSrc = src;
  if (src.includes('/lo/')) {
    hiSrc = src.replace('/lo/', '/hi/');
  } else if (src.includes('/s400x400/')) {
    hiSrc = src.replace('/s400x600/', '/s1280x1920/');
  } else if (/400(\.[a-z0-9]+)(\?.*)?$/i.test(src)) {
    hiSrc = src.replace(/400(\.[a-z0-9]+)(\?.*)?$/i, '1280$1$2');
  }
  return { loSrc: src, hiSrc };
}

function fit400(w, h) {
  const scale = Math.min(1, 400 / Math.max(w, h));
  return [Math.round(w * scale), Math.round(h * scale)];
}

const parsed = new DOMParser().parseFromString(
  document.getElementById('imgs').textContent,
  'text/html'
);

for (const img of parsed.querySelectorAll('img')) {
  const { loSrc, hiSrc } = parseSources(img);
  const line = document.createElement('div');
  line.className = 'line';
  line.textContent = img.getAttribute('alt') || '';
  list.appendChild(line);

  const gifv = isGifv(loSrc);
  const item = { line, loSrc, hiSrc, gifv, loImg: null, hiImg: null, loaded: false, loW: 0, loH: 0 };
  items.push(item);

  if (gifv) {
    const probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.muted = true;
    probe.onloadedmetadata = () => {
      item.loaded = true;
      [item.loW, item.loH] = fit400(probe.videoWidth, probe.videoHeight);
      line.classList.add('loaded');
      if (activeItem === item && !isZoomed) {
        showVideo(item.loSrc, item.loW, item.loH);
      }
    };
    probe.onerror = () => {
      if (isGifv(probe.src)) {
        item.loSrc = item.loSrc.replace(/\.gifv(\?.*)?$/i, '.mp4$1');
        item.hiSrc = item.hiSrc.replace(/\.gifv(\?.*)?$/i, '.mp4$1');
        probe.src = item.loSrc;
      }
    };
    probe.src = loSrc;
  } else {
    const loImg = new Image();
    item.loImg = loImg;
    loImg.onload = () => {
      item.loaded = true;
      [item.loW, item.loH] = fit400(loImg.naturalWidth, loImg.naturalHeight);
      line.classList.add('loaded');
      if (activeItem === item && !isZoomed) {
        draw(loImg, item.loW, item.loH);
      }
    };
    loImg.src = loSrc;
  }
}

function draw(img, cssW, cssH) {
  vid.style.display = 'none';
  vid.pause();
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.style.display = 'block';
  ctx.drawImage(img, 0, 0);
}

function showVideo(src, cssW, cssH) {
  canvas.style.display = 'none';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (vid.getAttribute('src') !== src) {
    vid.src = src;
  }
  vid.style.width = cssW + 'px';
  vid.style.height = cssH + 'px';
  vid.style.display = 'block';
  vid.play().catch(() => {});
}

function clearView() {
  canvas.style.display = 'none';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  vid.style.display = 'none';
  vid.pause();
}

function getTopItem() {
  for (const item of items) {
    const r = item.line.getBoundingClientRect();
    if (r.top <= 1 && r.bottom > 1) return item;
    if (r.top > 1) return null;
  }
  return null;
}

function onScroll() {
  if (isZoomed) return;
  const item = getTopItem();
  if (item === activeItem) return;
  if (activeItem) activeItem.line.classList.remove('active');
  activeItem = item;
  if (activeItem) activeItem.line.classList.add('active');
  if (item && item.loaded) {
    if (item.gifv) {
      showVideo(item.loSrc, item.loW, item.loH);
    } else {
      draw(item.loImg, item.loW, item.loH);
    }
  } else {
    clearView();
  }
}

function enterZoom() {
  if (isZoomed || !activeItem || !activeItem.loaded) return;
  isZoomed = true;
  const item = activeItem;

  if (item.gifv) {
    if (item.hiSrc !== item.loSrc) {
      showVideo(item.hiSrc, item.loW, item.loH);
    }
    return;
  }

  if (item.hiImg && item.hiImg.complete && item.hiImg.naturalWidth > 0) {
    draw(item.hiImg, item.loW, item.loH);
    return;
  }
  if (!item.hiImg) {
    item.hiImg = new Image();
    item.hiImg.onload = () => {
      if (isZoomed && activeItem === item) {
        draw(item.hiImg, item.loW, item.loH);
      }
    };
    item.hiImg.src = item.hiSrc;
  }
}

function getZoomFactor() {
  const vvScale = window.visualViewport ? window.visualViewport.scale : 1;
  const dprScale = (window.devicePixelRatio || baseDPR) / baseDPR;
  return Math.max(vvScale, dprScale);
}

function checkZoom() {
  const zoom = getZoomFactor();
  if (!isZoomed && zoom > 1.05) {
    enterZoom();
  } else if (isZoomed && zoom <= 1.02) {
    isZoomed = false;
    if (activeItem) activeItem.line.classList.remove('active');
    activeItem = null;
    onScroll();
  }
}

function touchDist(t) {
  return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
}

function openHiRes() {
  if (activeItem) window.open(activeItem.hiSrc, '_blank', 'noopener');
}

canvas.addEventListener('click', openHiRes);
vid.addEventListener('click', openHiRes);

window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', checkZoom);

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', checkZoom);
}

window.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  if (e.deltaY < 0) enterZoom();
  requestAnimationFrame(checkZoom);
}, { passive: true });

window.addEventListener('gesturechange', e => {
  if (e.scale > 1.05) enterZoom();
});
window.addEventListener('gestureend', checkZoom);

window.addEventListener('touchstart', e => {
  if (e.touches.length === 2) pinchStartDist = touchDist(e.touches);
}, { passive: true });

window.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchStartDist && touchDist(e.touches) > pinchStartDist * 1.05) {
    enterZoom();
  }
}, { passive: true });

window.addEventListener('touchend', () => {
  pinchStartDist = 0;
  checkZoom();
}, { passive: true });
</script>

</body>
</html>
